
services:

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API (used by the app)
      - "6334:6334"   # gRPC (optional, for dashboard)
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # The FastAPI agent
  app:
    build: 
      context: .        
    container_name: rag-data-analyst
    ports:
      - "8080:8080"
    env_file:
      - .env           
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant         
    restart: unless-stopped
    volumes:
      - ./data:/app/data

volumes:
  qdrant_storage:     